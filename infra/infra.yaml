AWSTemplateFormatVersion: '2010-09-09'
Description: >
  FinShield AI - INFRASTRUCTURE ONLY (stack: fs-infra). Storage, tables,
  alerting, log groups with 180-day retention and CloudWatch alarms.
  The backend (Lambdas, API, Step Functions, EventBridge rule) is deployed
  separately from template.yaml (stack: fs-stack) and uses these resources.

Parameters:
  AlertEmail:
    Type: String
    Description: Email address that receives SOC / CISO / DPO alerts
  LogRetentionDays:
    Type: Number
    Default: 180
    Description: CloudWatch log retention (CERT-In requires 180 days of logs)
  UseKmsForAadhaar:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: true = Aadhaar bucket uses its own KMS key (alias/fs-kyc-aadhaar). Set false if KMS is blocked in the sandbox (falls back to SSE-S3).

Conditions:
  UseKms: !Equals [!Ref UseKmsForAadhaar, "true"]

Resources:
  # ============================================================ KYC DOCUMENT STORE
  # ------------------------------------------ KMS key for the Aadhaar bucket
  AadhaarKmsKey:
    Type: AWS::KMS::Key
    Condition: UseKms
    Properties:
      Description: FinShield AI - key for the synthetic Aadhaar KYC document bucket
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
      Tags:
        - { Key: project, Value: finshield-ai }
        - { Key: data-class, Value: kyc-aadhaar }
        - { Key: synthetic, Value: "true" }

  AadhaarKmsAlias:
    Type: AWS::KMS::Alias
    Condition: UseKms
    Properties:
      AliasName: alias/fs-kyc-aadhaar
      TargetKeyId: !Ref AadhaarKmsKey

  # ------------------------------------------ KYC buckets (synthetic data only)
  KycAadhaarBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "fs-kyc-aadhaar-${AWS::AccountId}-${AWS::Region}"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - !If
            - UseKms
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: aws:kms
                KMSMasterKeyID: !GetAtt AadhaarKmsKey.Arn
              BucketKeyEnabled: true
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
      Tags:
        - { Key: project, Value: finshield-ai }
        - { Key: data-class, Value: kyc-aadhaar }
        - { Key: synthetic, Value: "true" }

  KycAadhaarBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref KycAadhaarBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt KycAadhaarBucket.Arn
              - !Sub "${KycAadhaarBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  KycPanBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "fs-kyc-pan-${AWS::AccountId}-${AWS::Region}"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - { Key: project, Value: finshield-ai }
        - { Key: data-class, Value: kyc-pan }
        - { Key: synthetic, Value: "true" }

  KycPanBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref KycPanBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt KycPanBucket.Arn
              - !Sub "${KycPanBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  KycVoterBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "fs-kyc-voter-${AWS::AccountId}-${AWS::Region}"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - { Key: project, Value: finshield-ai }
        - { Key: data-class, Value: kyc-voter }
        - { Key: synthetic, Value: "true" }

  KycVoterBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref KycVoterBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt KycVoterBucket.Arn
              - !Sub "${KycVoterBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ------------------------------------------ KYC document index table
  KycDocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fs-kyc-documents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: customer_id, AttributeType: S }
        - { AttributeName: document_type, AttributeType: S }
        - { AttributeName: data_category, AttributeType: S }
      KeySchema:
        - { AttributeName: customer_id, KeyType: HASH }
        - { AttributeName: document_type, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: by-category
          KeySchema:
            - { AttributeName: data_category, KeyType: HASH }
            - { AttributeName: customer_id, KeyType: RANGE }
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - { Key: project, Value: finshield-ai }

  # ============================================================ EXISTING (logs, cases, alerts)
  # ------------------------------------------------------------- S3 buckets
  RawLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "fs-raw-logs-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - { Key: project, Value: finshield-ai }
        - { Key: data-class, Value: raw-security-logs }

  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "fs-evidence-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - { Key: project, Value: finshield-ai }
        - { Key: data-class, Value: evidence-and-reports }

  # -------------------------------------------------------- DynamoDB tables
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fs-events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: actor_id, AttributeType: S }
        - { AttributeName: ts, AttributeType: S }
      KeySchema:
        - { AttributeName: actor_id, KeyType: HASH }
        - { AttributeName: ts, KeyType: RANGE }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - { Key: project, Value: finshield-ai }

  CasesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fs-cases
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: case_id, AttributeType: S }
      KeySchema:
        - { AttributeName: case_id, KeyType: HASH }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - { Key: project, Value: finshield-ai }

  # ----------------------------------------------------------- SNS alerts
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: fs-alerts
      DisplayName: FinShield AI Alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail
      Tags:
        - { Key: project, Value: finshield-ai }

  # ------------------------------- Log groups (created before the Lambdas)
  IngestLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/fs-ingest, RetentionInDays: !Ref LogRetentionDays }
  AnalyzeLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/fs-analyze, RetentionInDays: !Ref LogRetentionDays }
  EvidenceLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/fs-evidence, RetentionInDays: !Ref LogRetentionDays }
  ContainLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/fs-contain, RetentionInDays: !Ref LogRetentionDays }
  StoreTokenLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/fs-store-token, RetentionInDays: !Ref LogRetentionDays }
  RespondLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/fs-respond, RetentionInDays: !Ref LogRetentionDays }
  ReportLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/fs-report, RetentionInDays: !Ref LogRetentionDays }

  # --------------------------------- CloudWatch alarms -> SNS (monitoring)
  IngestErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: fs-ingest-errors
      AlarmDescription: fs-ingest is failing - events may not be processed
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [ { Name: FunctionName, Value: fs-ingest } ]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref AlertsTopic ]

  AnalyzeErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: fs-analyze-errors
      AlarmDescription: fs-analyze is failing - cases may not be analyzed
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [ { Name: FunctionName, Value: fs-analyze } ]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref AlertsTopic ]

  WorkflowFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: fs-response-workflow-failed
      AlarmDescription: The incident response workflow failed
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:fs-response-workflow"
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref AlertsTopic ]

Outputs:
  RawBucketName:
    Value: !Ref RawLogsBucket
    Export: { Name: fs-infra-RawBucketName }
  EvidenceBucketName:
    Value: !Ref EvidenceBucket
    Export: { Name: fs-infra-EvidenceBucketName }
  EventsTableName:
    Value: !Ref EventsTable
    Export: { Name: fs-infra-EventsTableName }
  CasesTableName:
    Value: !Ref CasesTable
    Export: { Name: fs-infra-CasesTableName }
  AlertsTopicArn:
    Value: !Ref AlertsTopic
    Export: { Name: fs-infra-AlertsTopicArn }
  KycAadhaarBucketName:
    Value: !Ref KycAadhaarBucket
    Export: { Name: fs-infra-KycAadhaarBucketName }
  KycPanBucketName:
    Value: !Ref KycPanBucket
    Export: { Name: fs-infra-KycPanBucketName }
  KycVoterBucketName:
    Value: !Ref KycVoterBucket
    Export: { Name: fs-infra-KycVoterBucketName }
  KycDocumentsTableName:
    Value: !Ref KycDocumentsTable
    Export: { Name: fs-infra-KycDocumentsTableName }
  KycDocumentsByCategoryIndex:
    Value: by-category
  AadhaarEncryption:
    Value: !If [UseKms, "SSE-KMS (alias/fs-kyc-aadhaar, rotation on, bucket key on)", "SSE-S3 (AES-256) - KMS fallback"]
  AadhaarKmsKeyArn:
    Condition: UseKms
    Value: !GetAtt AadhaarKmsKey.Arn
    Export: { Name: fs-infra-AadhaarKmsKeyArn }
  AadhaarKmsAlias:
    Condition: UseKms
    Value: alias/fs-kyc-aadhaar
